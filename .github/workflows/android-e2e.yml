name: Android E2E Tests

on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: 'Release tag للـ APK'
        required: false
        default: 'v1.0.0'

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧱 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔌 Install Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2

      - name: 🔧 Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ⬇️ Download APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: ${{ inputs.apk_tag || 'v1.0.0' }}
        run: |
          mkdir -p apks
          gh release download "$APK_TAG" --repo "${{ github.repository }}" --pattern 'app-release.apk' --dir apks --clobber
          unzip -tq apks/app-release.apk >/dev/null || { echo "::error::APK is corrupt"; exit 1; }
          ls -lh apks

      - name: 🧪 Run E2E on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI: 'true'
          # حط هنا أي متغيرات كانت في .env لوكال، مثال:
          # BASE_URL: ${{ secrets.BASE_URL }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run-e2e.sh

      - name: ⚙️ Generate Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: 📝 Add README to Allure Report
        if: always()
        run: |
          mkdir -p allure-report
          cat > allure-report/README.txt <<'EOF'
          How to view this Allure report:
          1. Unzip this artifact.
          2. Open a terminal inside the unzipped folder.
          3. Run ONE of:
               npx http-server .
               npx allure open .
          4. Open the URL printed in the terminal.
          DO NOT open index.html directly (double-click), it will appear blank.
          EOF

      - name: 📤 Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report
          if-no-files-found: warn

      - name: 📤 Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: |
            diagnostics/
            allure-results/
          retention-days: 7
          if-no-files-found: warn