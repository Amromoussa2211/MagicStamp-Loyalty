name: Android E2E Tests

on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: 'Release tag للـ APK'
        required: false
        default: 'v1.0.0'
      run_web:
        description: 'Run web (Playwright) tests in addition to mobile'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧱 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔌 Verify Appium drivers
        run: npx appium driver list --installed

      - name: 🔧 Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ⬇️ Download APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: ${{ inputs.apk_tag || 'v1.0.0' }}
        run: |
          mkdir -p apks
          gh release download "$APK_TAG" --repo "${{ github.repository }}" --pattern 'app-release.apk' --dir apks --clobber
          unzip -tq apks/app-release.apk >/dev/null || { echo "::error::APK is corrupt"; exit 1; }
          ls -lh apks

      - name: 🧪 Run E2E on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI: 'true'
          # SOFT_FAIL=1 → mobile job stays green regardless of the wdio verdict;
          # the real test status is still in the Allure report + summary step.
          SOFT_FAIL: '1'
          # حط هنا أي متغيرات كانت في .env لوكال، مثال:
          # BASE_URL: ${{ secrets.BASE_URL }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run-e2e.sh

      - name: 📋 Test summary (mobile)
        if: always()
        run: node scripts/allure-summary.js "Android E2E" >> "$GITHUB_STEP_SUMMARY" || true

      - name: 🔍 Check results
        if: always()
        run: |
          echo "--- allure-results ---"; ls -la allure-results | head -30
          echo "--- screenshots ---"; ls -la screenshots || true

      - name: 📤 Upload Mobile Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile-${{ github.run_id }}
          path: allure-results/
          if-no-files-found: warn

      - name: 📤 Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn

      - name: 📤 Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: |
            diagnostics/
            allure-results/
          retention-days: 7
          if-no-files-found: warn

  web-tests:
    if: ${{ inputs.run_web }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧱 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🌐 Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Web Tests (Playwright)
        run: npm run test:web
        # Pipeline stays green regardless of the Playwright verdict; the real
        # status is still in the Allure artifacts + summary step.
        continue-on-error: true

      - name: 📋 Test summary (web)
        if: always()
        run: node scripts/allure-summary.js "Web (Playwright)" >> "$GITHUB_STEP_SUMMARY" || true

      - name: 🔍 Check results
        if: always()
        run: |
          echo "result files: $(ls allure-results/*-result.json 2>/dev/null | wc -l)"
          ls -la allure-results | head -20 || true

      - name: 📤 Upload Web Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-${{ github.run_id }}
          path: allure-results/
          if-no-files-found: warn

  generate-report:
    needs: [e2e-tests, web-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧱 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⚙️ Install Allure CLI
        run: npm install --no-save allure-commandline@2.46.1

      - name: ⬇️ Download Mobile Allure Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-mobile-${{ github.run_id }}
          path: allure-results

      - name: ⬇️ Download Web Allure Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-web-${{ github.run_id }}
          path: allure-results

      - name: 🔍 Check merged results
        if: always()
        run: |
          mkdir -p allure-results
          echo "total files: $(ls allure-results | wc -l)"
          echo "result files: $(ls allure-results/*-result.json 2>/dev/null | wc -l)"
          ls -la allure-results | head -30

      - name: 🚨 Mobile-results watchdog
        if: always()
        run: node scripts/allure-fallback.js

      - name: ✂️ Trim traces from report copy (raw artifacts keep everything)
        if: always()
        run: node scripts/trim-report-inputs.js allure-results

      - name: ⚙️ Generate Combined Allure Report (single file)
        if: always()
        run: npx allure generate allure-results --clean -o allure-report --single-file

      - name: 📤 Upload Combined Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report
          if-no-files-found: warn 