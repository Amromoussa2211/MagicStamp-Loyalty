name: Android E2E Tests

on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: 'Release tag للـ APK'
        required: false
        default: 'v1.0.0'
      run_web:
        description: 'Run web (Playwright) tests in addition to mobile'
        required: false
        default: 'true'
        type: boolean

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧱 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🔌 Verify Appium drivers
        run: npx appium driver list --installed

      - name: 🔧 Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ⬇️ Download APK
        env:
          GH_TOKEN: ${{ github.token }}
          APK_TAG: ${{ inputs.apk_tag || 'v1.0.0' }}
        run: |
          mkdir -p apks
          gh release download "$APK_TAG" --repo "${{ github.repository }}" --pattern 'app-release.apk' --dir apks --clobber
          unzip -tq apks/app-release.apk >/dev/null || { echo "::error::APK is corrupt"; exit 1; }
          ls -lh apks

      - name: 🧪 Run E2E on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI: 'true'
          # حط هنا أي متغيرات كانت في .env لوكال، مثال:
          # BASE_URL: ${{ secrets.BASE_URL }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          ram-size: 3072M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run-e2e.sh

      - name: 🔍 Check results
        if: always()
        run: |
          echo "--- allure-results ---"; ls -la allure-results | head -30
          echo "--- screenshots ---"; ls -la screenshots || true

      # Upload raw mobile Allure results so the final report job can merge
      # them with the web suite results into ONE combined report.

      - name: 📤 Upload Mobile Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-mobile-${{ github.run_id }}
          path: allure-results/
          if-no-files-found: warn

      - name: 📤 Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn

      - name: 📤 Upload Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ github.run_id }}
          path: |
            diagnostics/
            allure-results/
          retention-days: 7
          if-no-files-found: warn

  web-tests:
    # Playwright web suite — no emulator needed. Produces its own Allure
    # results artifact that gets merged with the mobile one in the report job.
    if: ${{ inputs.run_web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧱 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🌐 Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: 🧪 Run Web Tests (Playwright)
        run: npm run test:web

      - name: 🔍 Check results
        if: always()
        run: |
          ls -la allure-results | head -20 || true

      - name: 📤 Upload Web Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-${{ github.run_id }}
          path: allure-results/
          if-no-files-found: warn

  generate-report:
    # One combined report: merges mobile (WDIO/Appium) + web (Playwright)
    # Allure results into a single allure-results folder, then generates once.
    needs: [e2e-tests, web-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🧱 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ⚙️ Install Allure CLI
        run: npm install --no-save allure-commandline@2.46.1

      - name: ⬇️ Download Mobile Allure Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-mobile-${{ github.run_id }}
          path: allure-results

      - name: ⬇️ Download Web Allure Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results-web-${{ github.run_id }}
          path: allure-results

      - name: 🔍 Check merged results
        if: always()
        run: |
          ls -la allure-results | head -30
          echo "--- mobile count ---"; ls allure-results/*-result.json | wc -l || true

      # Guarantee the report is honest even when the mobile session itself
      # failed (e.g. emulator never booted → zero mobile results written).
      - name: 🚨 Mobile-results watchdog
        if: always()
        run: node scripts/allure-fallback.js

      - name: ⚙️ Generate Combined Allure Report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: 📝 Add README to Allure Report
        if: always()
        run: |
          mkdir -p allure-report
          cat > allure-report/README.txt <<'EOF'
          How to view this Allure report:
          1. Unzip this artifact.
          2. Open a terminal inside the unzipped folder.
          3. Run ONE of:
               npx http-server .
               npx allure open .
          4. Open the URL printed in the terminal.
          DO NOT open index.html directly (double-click), it will appear blank.
          This report contains BOTH the mobile (WDIO/Appium) and web
          (Playwright) suites when web tests were enabled for this run.
          EOF

      - name: 📤 Upload Combined Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: allure-report
          if-no-files-found: warn